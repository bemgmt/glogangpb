<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <!-- Twitch themed overlay frame -->
  <!-- Top twitch active status banner -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="300" height="56" rx="10" fill="#9146ff" />
    <!-- Twitch simple logo SVG path representation -->
    <path d="M 30,13 L 20,23 L 20,43 L 32,43 L 32,51 L 40,43 L 48,43 L 58,33 L 58,13 Z M 34,19 L 38,19 L 38,33 L 34,33 Z M 44,19 L 48,19 L 48,33 L 44,33 Z" fill="#ffffff" transform="scale(0.8)" />
    <text x="75" y="36" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1">TWITCH LIVE</text>
  </g>

  <!-- Twitch viewers mock tag -->
  <g transform="translate(800, 40)">
    <rect x="0" y="0" width="240" height="56" rx="10" fill="rgba(0, 0, 0, 0.7)" stroke="#9146ff" stroke-width="2" />
    <circle cx="30" cy="28" r="8" fill="#ff0055" />
    <text x="52" y="36" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">12,408 VIEWERS</text>
  </g>

  <!-- Outer purple grid corner frames -->
  <path d="M 40,200 L 40,60 L 200,60" fill="none" stroke="#9146ff" stroke-width="6" />
  <path d="M 1040,200 L 1040,60 L 880,60" fill="none" stroke="#9146ff" stroke-width="6" />
  <path d="M 40,1720 L 40,1860 L 200,1860" fill="none" stroke="#9146ff" stroke-width="6" />
  <path d="M 1040,1720 L 1040,1860 L 880,1860" fill="none" stroke="#9146ff" stroke-width="6" />

  <!-- Bottom twitch tag details -->
  <g transform="translate(40, 1780)">
    <rect x="0" y="0" width="1000" height="80" rx="12" fill="rgba(7, 8, 10, 0.95)" stroke="#9146ff" stroke-width="2" />
    <text x="30" y="46" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold" fill="#ffffff">STREAMING NOW:</text>
    <text x="270" y="46" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="900" fill="#00e5ff">djmainodaplug</text>
    <!-- Follow heart -->
    <path d="M 940,24 C 930,14 910,14 900,24 L 890,34 L 880,24 C 870,14 850,14 840,24 C 830,34 830,54 840,64 L 890,114 L 940,64 C 950,54 950,34 940,24 Z" fill="#9146ff" transform="translate(50, -14) scale(0.3)" />
  </g>
</svg>
