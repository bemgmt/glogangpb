<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <!-- Cyberpunk corners -->
  <path d="M 30,120 L 30,30 L 120,30" fill="none" stroke="#00e5ff" stroke-width="8" />
  <path d="M 1050,120 L 1050,30 L 960,30" fill="none" stroke="#00e5ff" stroke-width="8" />
  <path d="M 30,1800 L 30,1890 L 120,1890" fill="none" stroke="#39ff14" stroke-width="8" />
  <path d="M 1050,1800 L 1050,1890 L 960,1890" fill="none" stroke="#39ff14" stroke-width="8" />

  <!-- Technical grid indicators -->
  <line x1="30" y1="960" x2="80" y2="960" stroke="#00e5ff" stroke-width="3" />
  <line x1="1000" y1="960" x2="1050" y2="960" stroke="#00e5ff" stroke-width="3" />
  <line x1="540" y1="30" x2="540" y2="80" stroke="#39ff14" stroke-width="3" />
  <line x1="540" y1="1840" x2="540" y2="1890" stroke="#39ff14" stroke-width="3" />

  <!-- Center target crosshair watermarks (very faint) -->
  <circle cx="540" cy="960" r="100" fill="none" stroke="#f8fafc" stroke-width="1" opacity="0.1" />
  <path d="M 540,840 L 540,1080 M 420,960 L 660,960" stroke="#f8fafc" stroke-width="1" opacity="0.1" />

  <!-- Digital data readouts -->
  <g font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.7">
    <text x="60" y="160">SYS_STATUS: ACTIVE</text>
    <text x="60" y="190">BOOTH_ID: PLUG_089</text>
    <text x="60" y="220">RESOLUTION: 1080X1920</text>
  </g>

  <g font-family="monospace" font-size="14" fill="#39ff14" opacity="0.7" text-anchor="end">
    <text x="1020" y="160">LATENCY: 12MS</text>
    <text x="1020" y="190">FILTER_MESH: OK</text>
    <text x="1020" y="220">FPS: 60.00</text>
  </g>

  <!-- Bottom tech text -->
  <g transform="translate(540, 1850)">
    <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="4">SYSTEM PROTOCOL // MAINO NETWORK</text>
  </g>
</svg>
