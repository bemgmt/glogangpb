<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <!-- Round cutout corner watermarks resembling record grooves -->
  <g opacity="0.15">
    <circle cx="540" cy="-300" r="700" fill="none" stroke="#f8fafc" stroke-width="4" />
    <circle cx="540" cy="-300" r="720" fill="none" stroke="#f8fafc" stroke-width="3" />
    <circle cx="540" cy="-300" r="740" fill="none" stroke="#f8fafc" stroke-width="2" />
    <circle cx="540" cy="-300" r="760" fill="none" stroke="#f8fafc" stroke-width="1" />
  </g>

  <g opacity="0.15">
    <circle cx="540" cy="2220" r="700" fill="none" stroke="#f8fafc" stroke-width="4" />
    <circle cx="540" cy="2220" r="720" fill="none" stroke="#f8fafc" stroke-width="3" />
    <circle cx="540" cy="2220" r="740" fill="none" stroke="#f8fafc" stroke-width="2" />
    <circle cx="540" cy="2220" r="760" fill="none" stroke="#f8fafc" stroke-width="1" />
  </g>

  <!-- Left Vinyl Edge -->
  <path d="M 0,300 A 660,660 0 0,0 0,1620" fill="none" stroke="#00e5ff" stroke-width="8" opacity="0.4" />
  <path d="M 0,350 A 610,610 0 0,0 0,1570" fill="none" stroke="#39ff14" stroke-width="2" opacity="0.3" />
  <path d="M 0,400 A 560,560 0 0,0 0,1520" fill="none" stroke="#f8fafc" stroke-width="1" opacity="0.15" />

  <!-- Right Vinyl Edge -->
  <path d="M 1080,300 A 660,660 0 0,1 1080,1620" fill="none" stroke="#00e5ff" stroke-width="8" opacity="0.4" />
  <path d="M 1080,350 A 610,610 0 0,1 1080,1570" fill="none" stroke="#39ff14" stroke-width="2" opacity="0.3" />
  <path d="M 1080,400 A 560,560 0 0,1 1080,1520" fill="none" stroke="#f8fafc" stroke-width="1" opacity="0.15" />

  <!-- Top branding -->
  <g transform="translate(540, 90)">
    <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="8">33 RPM // HEAVY VINYL</text>
  </g>

  <!-- Bottom branding -->
  <g transform="translate(540, 1830)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="40" font-weight="900" fill="#39ff14" text-anchor="middle" letter-spacing="6">SPINNING EXCLUSIVES</text>
  </g>
</svg>
