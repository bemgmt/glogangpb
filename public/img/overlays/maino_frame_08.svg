<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ffa000" />
    </linearGradient>
  </defs>

  <!-- Luxurious Gold Border -->
  <rect x="25" y="25" width="1030" height="1870" fill="none" stroke="url(#gold)" stroke-width="10" rx="30" opacity="0.9" />
  <rect x="42" y="42" width="996" height="1836" fill="none" stroke="#ffe082" stroke-width="2" rx="20" opacity="0.4" />

  <!-- Top VIP Banner -->
  <g transform="translate(540, 100)">
    <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#07080a" stroke="url(#gold)" stroke-width="2" />
    <text x="0" y="8" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="4">VIP MEMBER</text>
  </g>

  <!-- Stars in top corners -->
  <g transform="translate(100, 100)" fill="url(#gold)">
    <polygon points="0,-12 3,-3 12,-3 5,2 8,11 0,5 -8,11 -5,2 -12,-3 -3,-3" />
  </g>
  <g transform="translate(980, 100)" fill="url(#gold)">
    <polygon points="0,-12 3,-3 12,-3 5,2 8,11 0,5 -8,11 -5,2 -12,-3 -3,-3" />
  </g>

  <!-- Bottom ticket label -->
  <g transform="translate(540, 1760)">
    <rect x="-300" y="0" width="600" height="80" rx="10" fill="url(#gold)" />
    <text x="0" y="48" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" fill="#07080a" text-anchor="middle" letter-spacing="6">ALL-ACCESS PASS</text>
  </g>
</svg>
