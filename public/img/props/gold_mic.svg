<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ffa000" />
    </linearGradient>
  </defs>

  <!-- Microphone Handle -->
  <path d="M 90,105 L 75,170 C 73,178 78,185 86,185 L 94,185 C 102,185 107,178 105,170 L 110,105 Z" fill="#12151c" stroke="url(#gold-grad)" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Handle details -->
  <rect x="86" y="125" width="28" height="6" fill="url(#gold-grad)" />
  <rect x="94" y="140" width="12" height="15" rx="2" fill="#ff0055" />

  <!-- Microphone Grille Connector Ring -->
  <rect x="80" y="85" width="40" height="20" rx="3" fill="url(#gold-grad)" stroke="#07080a" stroke-width="2" />

  <!-- Microphone Grille Mesh (Sphere) -->
  <circle cx="100" cy="60" r="32" fill="url(#gold-grad)" stroke="#07080a" stroke-width="3" />
  
  <!-- Mesh lines -->
  <path d="M 75,45 Q 100,75 125,45 M 70,60 Q 100,90 130,60 M 75,75 Q 100,105 125,75" fill="none" stroke="#07080a" stroke-width="1.5" opacity="0.4" />
  <path d="M 75,45 Q 100,15 125,45 M 70,60 Q 100,30 130,60 M 75,75 Q 100,45 125,75" fill="none" stroke="#07080a" stroke-width="1.5" opacity="0.4" />
</svg>
