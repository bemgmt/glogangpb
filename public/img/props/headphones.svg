<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Headphones headband -->
  <path d="M 30,110 C 30,30 170,30 170,110" fill="none" stroke="#00e5ff" stroke-width="12" stroke-linecap="round" />
  <path d="M 30,110 C 30,30 170,30 170,110" fill="none" stroke="#07080a" stroke-width="4" stroke-linecap="round" />
  
  <!-- Left Ear Cushion -->
  <rect x="15" y="90" width="30" height="60" rx="15" fill="#39ff14" stroke="#07080a" stroke-width="4" />
  <rect x="25" y="100" width="10" height="40" rx="5" fill="#07080a" />

  <!-- Right Ear Cushion -->
  <rect x="155" y="90" width="30" height="60" rx="15" fill="#39ff14" stroke="#07080a" stroke-width="4" />
  <rect x="165" y="100" width="10" height="40" rx="5" fill="#07080a" />

  <!-- Headband joints -->
  <rect x="25" y="80" width="10" height="15" rx="2" fill="#00e5ff" />
  <rect x="165" y="80" width="10" height="15" rx="2" fill="#00e5ff" />
</svg>
