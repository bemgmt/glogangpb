<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Turntable Base -->
  <rect x="10" y="25" width="180" height="150" rx="12" fill="#12151c" stroke="#00e5ff" stroke-width="6" />
  
  <!-- Platter (Vinyl) -->
  <circle cx="90" cy="100" r="60" fill="#07080a" stroke="#39ff14" stroke-width="3" />
  <circle cx="90" cy="100" r="45" fill="none" stroke="#222" stroke-width="6" />
  <circle cx="90" cy="100" r="30" fill="none" stroke="#222" stroke-width="4" />
  
  <!-- Vinyl Center Label -->
  <circle cx="90" cy="100" r="16" fill="#00e5ff" />
  <circle cx="90" cy="100" r="4" fill="#07080a" />

  <!-- Tone Arm -->
  <path d="M 160,50 L 160,80 L 120,110 L 115,105" fill="none" stroke="#ffe082" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arm weight base -->
  <circle cx="160" cy="50" r="10" fill="#ffe082" />
  <!-- Arm stylus head -->
  <rect x="110" y="102" width="10" height="8" rx="2" fill="#39ff14" />

  <!-- Speed controls / Pitch fader -->
  <rect x="165" y="100" width="10" height="50" rx="2" fill="#07080a" />
  <rect x="162" y="120" width="16" height="8" rx="1" fill="#00e5ff" />
</svg>
