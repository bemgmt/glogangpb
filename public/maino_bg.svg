<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="cyan-glow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#07080a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="green-glow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07080a" stop-opacity="0" />
    </radialGradient>
    
    <!-- Pattern Definitions -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Dark Layer -->
  <rect width="100%" height="100%" fill="#07080a" />

  <!-- Ambient Color Glows -->
  <rect width="100%" height="100%" fill="url(#cyan-glow)" />
  <rect width="100%" height="100%" fill="url(#green-glow)" />

  <!-- Cyber Grid Pattern -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Equalizer / Soundwave Graphic Details in background -->
  <g opacity="0.15" transform="translate(100, 350)">
    <!-- Cyan sound waves -->
    <rect x="0" y="50" width="12" height="100" rx="6" fill="#00e5ff" />
    <rect x="24" y="20" width="12" height="160" rx="6" fill="#00e5ff" />
    <rect x="48" y="70" width="12" height="120" rx="6" fill="#00e5ff" />
    <rect x="72" y="10" width="12" height="200" rx="6" fill="#00e5ff" />
    <rect x="96" y="80" width="12" height="100" rx="6" fill="#00e5ff" />
    <rect x="120" y="40" width="12" height="140" rx="6" fill="#00e5ff" />
    <rect x="144" y="90" width="12" height="80" rx="6" fill="#00e5ff" />
    <rect x="168" y="30" width="12" height="150" rx="6" fill="#00e5ff" />
  </g>

  <g opacity="0.1" transform="translate(1100, 150)">
    <!-- Volt green sound waves -->
    <rect x="0" y="80" width="10" height="100" rx="5" fill="#39ff14" />
    <rect x="20" y="40" width="10" height="180" rx="5" fill="#39ff14" />
    <rect x="40" y="90" width="10" height="80" rx="5" fill="#39ff14" />
    <rect x="60" y="20" width="10" height="220" rx="5" fill="#39ff14" />
    <rect x="80" y="110" width="10" height="60" rx="5" fill="#39ff14" />
    <rect x="100" y="60" width="10" height="140" rx="5" fill="#39ff14" />
  </g>
</svg>
